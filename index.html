<!-- AUDIO ELEMENT SA DIREKTNIM JAVNIM IZVOROM -->
<audio id="bcBackgroundAudio" loop preload="auto">
    <source src="https://ia800501.us.archive.org/11/items/riblja-corba-pogledaj-dom-svoj-andjele/Riblja%20Corba%20-%20Pogledaj%20dom%20svoj%20andjele.mp3" type="audio/mpeg">
</audio>

<button type="button" id="bcAudioToggle" aria-label="Звук песме">
    <span id="bcAudioIcon">🔊</span> <span id="bcAudioText">Музика: Укључено</span>
</button>

<script>
(function () {
    const year = document.getElementById("bcFooterYear");
    if (year) year.textContent = new Date().getFullYear();

    // Modal
    const openCard = document.getElementById("bcCredoOpenCard");
    const modal = document.getElementById("bcCredoModal");
    const closeBtn = document.getElementById("bcCredoCloseBtn");

    if (openCard && modal && closeBtn) {
        openCard.addEventListener("click", () => {
            modal.classList.add("bc-modal-active");
            document.body.style.overflow = "hidden";
        });
        const close = () => {
            modal.classList.remove("bc-modal-active");
            document.body.style.overflow = "";
        };
        closeBtn.addEventListener("click", close);
        modal.addEventListener("click", (e) => { if (e.target === modal) close(); });
        document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
    }

    // Mobilni meni
    const button = document.getElementById("bcMenuButton");
    const nav = document.getElementById("bcNav");
    if (button && nav) {
        button.addEventListener("click", function () {
            const open = nav.classList.toggle("bc-open");
            button.classList.toggle("bc-active", open);
        });
        nav.querySelectorAll('a[href^="#"]').forEach(link => {
            link.addEventListener("click", () => {
                nav.classList.remove("bc-open");
                button.classList.remove("bc-active");
            });
        });
    }

    // Automatski obilazak
    const tourBtn = document.getElementById("bcStartTourBtn");
    let isTourRunning = false;

    if (tourBtn) {
        tourBtn.addEventListener("click", function (e) {
            e.preventDefault();
            if (isTourRunning) return;
            isTourRunning = true;

            const startY = window.pageYOffset;
            const targetY = Math.max(
                document.body.scrollHeight,
                document.documentElement.scrollHeight
            ) - window.innerHeight;
            const distance = targetY - startY;
            const duration = 18000;
            let startTime = null;

            function stopAnimation() {
                isTourRunning = false;
                window.removeEventListener("wheel", stopAnimation);
                window.removeEventListener("touchstart", stopAnimation);
            }

            window.addEventListener("wheel", stopAnimation, { passive: true });
            window.addEventListener("touchstart", stopAnimation, { passive: true });

            function step(timestamp) {
                if (!isTourRunning) return;
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / duration, 1);

                window.scrollTo(0, startY + distance * progress);

                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    stopAnimation();
                }
            }

            window.requestAnimationFrame(step);
        });
    }

    // =========================================================
    // AUDIO: DIREKTNO OD REFRENA (86. SEKUNDA)
    // =========================================================
    const audio = document.getElementById("bcBackgroundAudio");
    const audioToggle = document.getElementById("bcAudioToggle");
    const audioIcon = document.getElementById("bcAudioIcon");
    const audioText = document.getElementById("bcAudioText");
    
    // Vreme početka refrena u sekundama (1m 26s)
    const chorusStartTime = 86; 
    let isAudioStarted = false;

    function startChorusMusic() {
        if (!audio || isAudioStarted) return;

        // Postavi tačno na početak refrena
        try {
            audio.currentTime = chorusStartTime;
        } catch (err) {}

        audio.play().then(() => {
            isAudioStarted = true;
            if (audioIcon) audioIcon.textContent = "🔊";
            if (audioText) audioText.textContent = "Музика: Укључено";
            removeTriggers();
        }).catch(() => {
            // Ako telefon traži gest, čeka prvi dodir/klik/skrol
        });
    }

    function interactionHandler() {
        startChorusMusic();
    }

    function removeTriggers() {
        document.removeEventListener("click", interactionHandler);
        document.removeEventListener("touchstart", interactionHandler);
        document.removeEventListener("scroll", interactionHandler);
        window.removeEventListener("scroll", interactionHandler);
    }

    // Pokušaj odmah po učitavanju
    startChorusMusic();

    // Pokretanje na prvu interakciju ako mobilni pretraživač blokira automatski zvuk
    document.addEventListener("click", interactionHandler, { passive: true });
    document.addEventListener("touchstart", interactionHandler, { passive: true });
    document.addEventListener("scroll", interactionHandler, { passive: true, once: true });
    window.addEventListener("scroll", interactionHandler, { passive: true, once: true });

    // Taster za uključivanje / isključivanje zvuka
    if (audioToggle && audio) {
        audioToggle.addEventListener("click", function (e) {
            e.stopPropagation();
            if (!audio.paused) {
                audio.pause();
                if (audioIcon) audioIcon.textContent = "🔇";
                if (audioText) audioText.textContent = "Музика: Искључено";
            } else {
                if (audio.currentTime < chorusStartTime - 5) {
                    audio.currentTime = chorusStartTime;
                }
                audio.play().then(() => {
                    isAudioStarted = true;
                    if (audioIcon) audioIcon.textContent = "🔊";
                    if (audioText) audioText.textContent = "Музика: Укључено";
                });
            }
        });
    }
})();
</script>
<script src="bc-engine.js"></script>
</body>
</html>
